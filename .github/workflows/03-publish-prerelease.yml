name: NuGet Prerelease 

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-multiplatform:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore
        working-directory: ./src

      - name: Build solution
        run: dotnet build -c Release --no-restore
        working-directory: ./src

      - name: Run tests
        run: dotnet test -c Release --no-build --no-restore --verbosity normal
        working-directory: ./src

  publish-prerelease:
    runs-on: ubuntu-latest
    needs: test-multiplatform
    permissions:
      contents: read
    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    defaults:
      run:
        working-directory: src

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: '6.x'

      - name: Calculate version
        id: gv
        uses: gittools/actions/gitversion/execute@v4

      - name: Build prerelease version
        id: prerelease
        run: |
          # Only develop-sourced prereleases inherit GitVersion's predicted
          # MAJOR.MINOR.PATCH — that's the branch we release stable from, so
          # the prediction is meaningful. Feature branches get a fixed 0.0.0
          # base so the version string doesn't silently promise a release
          # target (`3.2.0-short-names.2` suggests "this is going to be 3.2.0",
          # which may not be true if the branch dies or gets re-scoped).
          LABEL="${{ steps.gv.outputs.PreReleaseLabel }}"
          N="${{ steps.gv.outputs.CommitsSinceVersionSource }}"

          if [ -z "$LABEL" ]; then
            echo "::error ::GitVersion produced empty PreReleaseLabel for $GITHUB_REF. Check GitVersion.yml branch rules — refusing to build a malformed version."
            exit 1
          fi

          if [ "$GITHUB_REF" = "refs/heads/develop" ]; then
            BASE="${{ steps.gv.outputs.MajorMinorPatch }}"
          else
            BASE="0.0.0"
          fi

          VERSION="${BASE}-${LABEL}.${N}"

          echo "PACKAGE_VERSION=$VERSION" >> $GITHUB_ENV
          echo "PACKAGE_VERSION=$VERSION" >> $GITHUB_OUTPUT

          echo "Calculated prerelease version: $VERSION"

      - name: Log calculated version
        run: |
          echo "GitVersion SemVer (original): ${{ steps.gv.outputs.SemVer }}"
          echo "Using PACKAGE_VERSION:        $PACKAGE_VERSION"

      - name: Restore dependencies
        run: dotnet restore
        working-directory: ./src

      - name: Build solution
        run: dotnet build -c Release --no-restore -p:Version=$PACKAGE_VERSION -p:AssemblyVersion=${{ steps.gv.outputs.AssemblySemVer }} -p:FileVersion=${{ steps.gv.outputs.AssemblySemFileVer }}
        working-directory: ./src

      - name: Pack NuGet packages (incl. symbols)
        run: dotnet pack -c Release --no-restore /p:IncludeSymbols=true /p:SymbolPackageFormat=snupkg -o ../artifacts -p:Version=$PACKAGE_VERSION
        working-directory: ./src

      - name: Ensure packages exist
        run: |
          shopt -s nullglob
          files=("$GITHUB_WORKSPACE"/artifacts/*.nupkg "$GITHUB_WORKSPACE"/artifacts/*.snupkg)
          (( ${#files[@]} )) || { echo "::error ::No packages found in artifacts/"; exit 1; }

      - name: Upload artifacts (audit)
        uses: actions/upload-artifact@v5
        with:
          name: prerelease-packages-${{ env.PACKAGE_VERSION }}
          path: ${{ github.workspace }}/artifacts
          retention-days: 30

      - name: Push prerelease to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          shopt -s nullglob
          for p in "$GITHUB_WORKSPACE"/artifacts/*.nupkg "$GITHUB_WORKSPACE"/artifacts/*.snupkg; do
            echo "Pushing prerelease package: $p"
            dotnet nuget push "$p" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
          done
